server {
    listen 80;
    listen [::]:80;
    server_name holiday.albert90.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name holiday.albert90.cn;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    ssl_certificate /etc/letsencrypt/live/holiday.albert90.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holiday.albert90.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/niuma-holiday-value/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
